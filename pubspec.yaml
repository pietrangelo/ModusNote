name: modusnote_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/modusnote
  - packages/identity_cryptography
  - packages/schema_dynamic_content
  - packages/blob_storage_media
  - packages/collaboration_access_control
  - packages/offline_sync
  - packages/identity_cryptography_adapters
  - packages/blob_storage_media_adapters
  - packages/blob_storage_media_recorder_adapters
  - packages/offline_sync_adapters
  - tool/architecture_guard

dev_dependencies:
  lints: ^6.0.0

hooks:
  user_defines:
    flutter_soloud:
      # Recordings reach the player already decoded to WAV by our own
      # libopus, so SoLoud needs no Xiph codecs; without this its build
      # hook downloads prebuilt ones that no hash of ours pins.
      no_xiph_libs: true
