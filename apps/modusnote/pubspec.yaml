name: modusnote
description: "ModusNote: note offline-first cifrate end-to-end, a schemi dinamici."
publish_to: none
version: 0.3.0+8
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  blob_storage_media: any
  blob_storage_media_adapters: any
  blob_storage_media_recorder_adapters: any
  collaboration_access_control: any
  flutter:
    sdk: flutter
  flutter_soloud: 5.2.1
  flutter_localizations:
    sdk: flutter
  file: ^7.0.1
  identity_cryptography: any
  image_picker: ^1.2.4
  identity_cryptography_adapters: any
  intl: any
  offline_sync: any
  offline_sync_adapters: any
  path_provider: ^2.1.6
  schema_dynamic_content: any
  sodium: ^4.1.1
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3
  web: ^1.1.1
  flutter_local_notifications: 22.3.2
  timezone: ^0.11.0

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  http: ^1.6.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    # Typefaces for the page, loaded only when chosen (`ReadingFonts`), so
    # they are plain assets: a font in `fonts:` is fetched at every start
    # of the web client.
    - assets/fonts/reading/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Music.ttf
