name: modusnote
description: "ModusNote: note offline-first cifrate end-to-end, a schemi dinamici."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  collaboration_access_control: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  identity_cryptography: any
  identity_cryptography_adapters: any
  intl: any
  offline_sync: any
  offline_sync_adapters: any
  path_provider: ^2.1.6
  schema_dynamic_content: any
  sodium: ^4.1.1
  sqlite3: ^3.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
