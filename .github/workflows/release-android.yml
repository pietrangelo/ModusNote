name: Android release

# Builds the signed Android App Bundle to upload to Google Play. Runs by hand
# (Actions › Android release › Run workflow) or on a tag android-v<version>.
# The bundle is signed with the upload key; Google Play re-signs what it
# delivers with the app signing key it keeps (Play App Signing).
#
# Needs four secrets of the GitHub environment `production`, open to main
# and to tags android-v* only (never repository secrets, which a workflow
# pushed on any branch could read), never sent anywhere else:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), in base64
#   ANDROID_UPLOAD_STORE_PASSWORD   its password
#   ANDROID_UPLOAD_KEY_ALIAS        the key's alias
#   ANDROID_UPLOAD_KEY_PASSWORD     the key's password (for a PKCS12 keystore,
#                                   keytool's default, the store password)
#
# versionCode is this workflow's run number + 1, so every bundle built here
# is newer than the last; versionName comes from pubspec.yaml. The sync
# project is fixed in as for the web client (its URL and publishable key are
# public: they ship in every client).

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  # The sync server: our Worker, which also serves the web client.
  MODUSNOTE_SERVER: https://modus.serv.run

jobs:
  bundle:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Upload key
        working-directory: apps/modusnote/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo '::error::The ANDROID_UPLOAD_* secrets of the production environment are not set.'
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          # Open the key now, as Gradle will, instead of failing after the
          # build. keytool ignores a separate key password for PKCS12
          # keystores (its default), so there the store password opens it.
          opens=$(java ../tool/CheckUploadKey.java "$keystore")
          if [ "$opens" = store ]; then
            echo '::warning::ANDROID_UPLOAD_KEY_PASSWORD does not open the key; the store password does, so it is used. Set the secret to the store password.'
            KEY_PASSWORD=$STORE_PASSWORD
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Resolve workspace
        run: flutter pub get

      - name: Build the App Bundle
        working-directory: apps/modusnote
        run: |
          flutter build appbundle --release \
            --build-number=$((GITHUB_RUN_NUMBER + 1)) \
            --dart-define=MODUSNOTE_SERVER="$MODUSNOTE_SERVER"

      - name: Forget the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" apps/modusnote/android/key.properties

      - name: Check the bundle
        working-directory: apps/modusnote
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          tool/check_android_bundle.sh "$aab"
          # Signed with the upload key, never the debug one.
          keytool -printcert -jarfile "$aab" > build/signer.txt
          if grep -q 'CN=Android Debug' build/signer.txt; then
            echo '::error::The bundle is signed with the debug key.'
            exit 1
          fi
          {
            echo "### Android App Bundle ($(git rev-parse --short HEAD), versionCode $((GITHUB_RUN_NUMBER + 1)))"
            echo '```'
            sha256sum "$aab"
            grep -E 'Owner:|SHA256:' build/signer.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modusnotes-aab-${{ github.run_number }}
          path: apps/modusnote/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
