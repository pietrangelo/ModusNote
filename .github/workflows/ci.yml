name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Verify the pinned libopus hash against xiph.org
        run: |
          hook=packages/blob_storage_media_adapters/hook/build.dart
          version=$(sed -n "s/^const opusVersion = '\(.*\)';/\1/p" "$hook")
          pinned=$(grep -A1 '^const opusSha256' "$hook" | grep -o '[0-9a-f]\{64\}')
          published=$(curl -fsSL https://downloads.xiph.org/releases/opus/SHA256SUMS.txt \
            | grep " opus-$version.tar.gz$" | cut -d' ' -f1)
          echo "opus $version pinned=$pinned published=$published"
          test -n "$published" && test "$pinned" = "$published"

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Architecture guard
        run: dart run tool/architecture_guard/bin/architecture_guard.dart

      - name: Domain and tooling tests
        run: |
          for dir in packages/* tool/*; do
            if [ -d "$dir/test" ]; then
              echo "::group::$dir"
              if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then
                (cd "$dir" && flutter test) || exit 1
              else
                (cd "$dir" && dart test) || exit 1
              fi
              echo "::endgroup::"
            fi
          done

      - name: Wire formats compiled to JavaScript
        # The web build falls back to dart2js on browsers without WasmGC,
        # where 64-bit integers behave differently: these run in Chrome.
        run: |
          for dir in packages/offline_sync packages/blob_storage_media; do
            (cd "$dir" && dart test -p chrome test/portable_int64_test.dart) || exit 1
          done

      - name: Supabase schema and RLS tests
        run: bash supabase/tests/run.sh

      - name: Supabase adapter against PostgREST
        run: bash supabase/tests/e2e.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Edge Function tests
        run: node --test "supabase/functions/**/*_test.ts"

      - name: App tests
        working-directory: apps/modusnote
        run: flutter test

      - name: Web build
        working-directory: apps/modusnote
        run: |
          flutter build web --wasm --csp --no-web-resources-cdn
          dart run tool/finalize_web_build.dart > build/web-sha256sums.txt
          {
            echo '### Web bundle SHA-256'
            echo '```'
            cat build/web-sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Web client in Chrome under its CSP (Wasm and JavaScript builds)
        working-directory: apps/modusnote/tool/web_e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: apps/modusnote/build/web
          if-no-files-found: error
