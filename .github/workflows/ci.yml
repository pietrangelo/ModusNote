name: CI

# A change made only of documents (Markdown, LICENSE, NOTICE, docs/) runs
# nothing, so no deploy follows it either. SECURITY.md stays in: a test
# compares it with security.txt.
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', 'SECURITY.md', '!LICENSE', '!NOTICE', '!docs/**']
  pull_request:
    paths: ['**', '!**.md', 'SECURITY.md', '!LICENSE', '!NOTICE', '!docs/**']

permissions:
  contents: read

# A new push to a pull request makes its running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts the change touches, documents left out: the app (everything
  # but server/, whose golden vectors the Dart tests read), the server (its
  # end-to-end test runs the Dart packages too) and the Android build, which
  # takes half the app's run. A pull request is compared with its base, a
  # push on main with the commit before it; when that is missing, all run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      server: ${{ steps.diff.outputs.server }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          if git fetch --depth=1 origin "$BASE" 2>/dev/null; then
            git diff --name-only FETCH_HEAD HEAD \
              | grep -vE '\.md$|^(LICENSE|NOTICE|docs/.*)$' > changed.txt || true
            git diff --name-only FETCH_HEAD HEAD | grep -x SECURITY.md >> changed.txt || true
          else
            git ls-files > changed.txt
          fi
          cat changed.txt
          {
            if grep -qvE '^server/' changed.txt || grep -qE '^server/vectors/' changed.txt
            then echo app=true; else echo app=false; fi
            if grep -qE '^(server/|packages/|tool/deploy/|pubspec\.(yaml|lock)$|\.github/workflows/)' changed.txt
            then echo server=true; else echo server=false; fi
            if grep -qE '^(apps/modusnote/android/|apps/modusnote/tool/check_android_bundle\.sh|packages/[^/]+/hook/|.*pubspec\.(yaml|lock)$|\.github/workflows/)' changed.txt
            then echo android=true; else echo android=false; fi
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Verify the pinned libopus hash against xiph.org
        run: |
          hook=packages/blob_storage_media_adapters/hook/build.dart
          version=$(sed -n "s/^const opusVersion = '\(.*\)';/\1/p" "$hook")
          pinned=$(grep -A1 '^const opusSha256' "$hook" | grep -o '[0-9a-f]\{64\}')
          published=$(curl -fsSL https://downloads.xiph.org/releases/opus/SHA256SUMS.txt \
            | grep " opus-$version.tar.gz$" | cut -d' ' -f1)
          echo "opus $version pinned=$pinned published=$published"
          test -n "$published" && test "$pinned" = "$published"

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Architecture guard
        run: dart run tool/architecture_guard/bin/architecture_guard.dart

      - name: Domain and tooling tests
        run: |
          for dir in packages/* tool/*; do
            if [ -d "$dir/test" ]; then
              echo "::group::$dir"
              if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then
                (cd "$dir" && flutter test) || exit 1
              else
                (cd "$dir" && dart test) || exit 1
              fi
              echo "::endgroup::"
            fi
          done

      - name: Wire formats compiled to JavaScript
        # The web build falls back to dart2js on browsers without WasmGC,
        # where 64-bit integers behave differently: these run in Chrome.
        run: |
          for dir in packages/offline_sync packages/blob_storage_media; do
            (cd "$dir" && dart test -p chrome test/portable_int64_test.dart) || exit 1
          done

      - name: Browser audio and storage in Chrome
        # IndexedDB blobs, WebCodecs Opus and the Ogg container, compiled
        # both ways the web build ships: JavaScript and WebAssembly.
        working-directory: packages/blob_storage_media_adapters
        run: |
          for compiler in dart2js dart2wasm; do
            dart test -p chrome -c "$compiler" test/web \
              test/ogg_opus_muxer_test.dart test/ogg_opus_demuxer_test.dart || exit 1
          done

      - name: Passkeys in Chrome
        # WebAuthn bindings, both compilers; the ceremony itself runs in the
        # end-to-end test against Chrome's virtual authenticator.
        working-directory: packages/identity_cryptography_adapters
        run: |
          for compiler in dart2js dart2wasm; do
            dart test -p chrome -c "$compiler" test/web || exit 1
          done

      - name: Supabase schema and RLS tests
        run: bash supabase/tests/run.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Edge Function tests
        run: node --test "supabase/functions/**/*_test.ts"

      - name: App tests
        working-directory: apps/modusnote
        run: flutter test

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android App Bundle
        if: needs.changes.outputs.android == 'true'
        # The same release build Google Play gets, signed with the debug key
        # (the upload key lives only in release-android.yml): native
        # libraries 16 KB aligned, network and backup rules in the manifest.
        working-directory: apps/modusnote
        run: |
          flutter build appbundle --release
          tool/check_android_bundle.sh build/app/outputs/bundle/release/app-release.aab

      - name: Web build
        working-directory: apps/modusnote
        run: |
          flutter build web --wasm --csp --no-web-resources-cdn
          dart run tool/finalize_web_build.dart > build/web-sha256sums.txt
          {
            echo '### Web bundle SHA-256'
            echo '```'
            cat build/web-sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Web client in Chrome under its CSP (Wasm and JavaScript builds)
        working-directory: apps/modusnote/tool/web_e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: web-e2e-failures
          path: apps/modusnote/tool/web_e2e/failures
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-bundle
          path: apps/modusnote/build/web
          if-no-files-found: error

  # The sync server on Durable Objects (CLAUDE.md, «Server su Durable Objects»): the Rust
  # crates against the golden vectors, then the Worker in workerd with local Durable Objects
  # and R2. Nothing here talks to Cloudflare.
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The app's own adapter runs against the Worker too (e2e/run.sh).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve the Dart workspace
        working-directory: .
        run: flutter pub get

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Lint, native and for Workers
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked -p modusnote-server --target wasm32-unknown-unknown -- -D warnings

      - name: Tests, golden vectors included
        run: cargo test --locked

      - name: Worker against workerd, Durable Objects and R2
        run: bash e2e/run.sh
