name: Deploy web

# Publishes the web client and the sync server, one Worker (server/worker,
# the client as its Static Assets), once CI has passed on main. The bundle
# is rebuilt from the same commit and its SHA-256 list goes in the job
# summary, so anyone can compare what modus.serv.run serves with what this
# commit builds. The client talks to its own origin, so nothing about the
# server is compiled into it.
#
# Then the servpub Worker (server/pages), serv.pub's public pages, which
# reads the ModusSite objects of the first: always deployed after it.
#
# Needs two secrets of the GitHub environment `production`, open to main
# only: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers R2 Storage:
# Read, and Workers Routes: Edit on the serv.run and serv.pub zones, nothing
# else) and
# CLOUDFLARE_ACCOUNT_ID. Never repository secrets: a workflow pushed on any
# branch, or run by hand from it, could read those and publish its own
# bundle on modus.serv.run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  WRANGLER: ${{ github.workspace }}/tool/deploy/node_modules/.bin/wrangler

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Resolve workspace
        run: flutter pub get

      # Wrangler and every package under it come from the committed lockfile
      # (integrity hashes), never resolved afresh with the token around.
      - name: Install wrangler
        working-directory: tool/deploy
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the web client
        working-directory: apps/modusnote
        run: |
          flutter build web --wasm --csp --no-web-resources-cdn
          dart run tool/finalize_web_build.dart > build/web-sha256sums.txt
          {
            echo "### Web bundle SHA-256 ($(git rev-parse --short HEAD))"
            echo '```'
            cat build/web-sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # wrangler.toml builds the Worker (worker-build, pinned) and uploads it
      # with the bundle above as its assets.
      - name: Deploy the Worker
        working-directory: server/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: '"$WRANGLER" deploy'

      # serv.pub reads the ModusSite objects deployed just above.
      - name: Deploy serv.pub
        working-directory: server/pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: '"$WRANGLER" deploy'
