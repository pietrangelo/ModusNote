[package]
name = "modusnote-server"
description = "Cloudflare Worker shell: HTTP in, the sync use cases in Durable Objects, blobs in R2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ledger.workspace = true
sync.workspace = true
crypto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[lints]
workspace = true
