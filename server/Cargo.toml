[workspace]
resolver = "3"
members = ["crates/ledger", "crates/crypto", "crates/sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/pietrangelo/ModusNote"
rust-version = "1.88"
publish = false

[workspace.dependencies]
ledger = { path = "crates/ledger" }
crypto = { path = "crates/crypto" }
sync = { path = "crates/sync" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
