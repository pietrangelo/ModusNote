  http: ^1.6.0
  identity_cryptography: any
  offline_sync: any
  sqlite3: ^3.7.0

dev_dependencies:
  crypto: ^3.0.7
  identity_cryptography_adapters: any
  lints: ^6.0.0
  sodium: ^4.1.1
  test: ^1.26.0
