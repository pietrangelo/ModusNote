<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="t d">
  <title id="t">Modus Notes · architettura di rete</title>
  <desc id="d">Dispositivi Android, iOS e browser con le chiavi; Cloudflare Pages, Supabase e Cloudflare R2 vedono solo ciphertext; GitHub Actions costruisce e pubblica.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #F8FAFC; }
      .h1 { font-size: 26px; font-weight: 700; }
      .sub { font-size: 13px; fill: #8F9CAE; }
      .zone { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
      .h2 { font-size: 16px; font-weight: 700; }
      .h3 { font-size: 13px; font-weight: 700; }
      .li { font-size: 12px; fill: #C9D2DE; }
      .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #C9D2DE; }
      .lbl { font-size: 11px; fill: #F8FAFC; }
      .lblm { font-size: 10px; fill: #8F9CAE; }
      .card { fill: #13192B; stroke: #2A3350; stroke-width: 1; }
      .inner { fill: #0E1322; stroke: #2A3350; stroke-width: 1; }
      .cipher { stroke: #00A3FF; stroke-width: 2; fill: none; }
      .ctrl { stroke: #8F9CAE; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00A3FF"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8F9CAE"/></marker>
  </defs>

  <rect width="1200" height="980" fill="#090C15"/>

  <text x="30" y="48" class="h1">Modus Notes · <tspan fill="#EBB448">architettura di rete</tspan></text>
  <text x="30" y="72" class="sub">Le chiavi e il testo in chiaro restano sui dispositivi. Pages, Supabase e R2 ricevono e restituiscono solo ciphertext prodotto dalle buste del dominio.</text>

  <!-- ============ Dispositivi (zona fidata) ============ -->
  <rect x="20" y="100" width="440" height="620" rx="13" fill="none" stroke="#EBB448" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="38" y="124" class="zone" fill="#EBB448">DISPOSITIVI · CHIAVI E TESTO IN CHIARO</text>

  <rect x="38" y="140" width="404" height="262" rx="8" class="card"/>
  <rect x="38" y="140" width="5" height="262" fill="#EBB448"/>
  <text x="56" y="166" class="h2">App Android · iOS</text>
  <text x="56" y="184" class="lblm">Flutter AOT · run.serv.modus · Google Play</text>
  <text x="56" y="210" class="li">• Vault <tspan class="mono">vault.sqlite</tspan>: solo buste cifrate</text>
  <text x="56" y="230" class="li">• Blob <tspan class="mono">.enc</tspan> nella cartella privata dell'app</text>
  <text x="56" y="250" class="li">• libsodium nativo (build hook): Argon2id,</text>
  <text x="68" y="266" class="li">XChaCha20-Poly1305, Ed25519, X-Wing</text>
  <text x="56" y="286" class="li">• Microfono PCM → libopus (FFI) → Ogg Opus,</text>
  <text x="68" y="302" class="li">cifrato a chunk mentre registra: nessun file in chiaro</text>
  <text x="56" y="322" class="li">• Riproduzione in memoria (flutter_soloud)</text>
  <text x="56" y="342" class="li">• Notifiche locali per la scadenza delle password</text>
  <text x="56" y="362" class="li">• FLAG_SECURE (Android), copertura privacy (iOS)</text>
  <text x="56" y="382" class="li">• Vault fuori dai backup di Android</text>

  <rect x="38" y="418" width="404" height="286" rx="8" class="card"/>
  <rect x="38" y="418" width="5" height="286" fill="#EBB448"/>
  <text x="56" y="444" class="h2">Browser · modus.serv.run</text>
  <text x="56" y="462" class="lblm">Flutter Web WebAssembly (ricade su dart2js senza WasmGC)</text>
  <text x="56" y="488" class="li">• SQLite WASM su IndexedDB <tspan class="mono">/vault.sqlite</tspan></text>
  <text x="56" y="508" class="li">• Blob cifrati in IndexedDB <tspan class="mono">modusnote-blobs</tspan></text>
  <text x="56" y="528" class="li">• libsodium.js sumo servito dalla nostra origine</text>
  <text x="56" y="548" class="li">• WebCodecs Opus (o WAV) · riproduzione Web Audio</text>
  <text x="56" y="568" class="li">• Sblocco con passphrase o passkey WebAuthn + PRF</text>
  <text x="56" y="588" class="li">• CSP rigorosa, Trusted Types, SRI sugli script,</text>
  <text x="68" y="604" class="li">COOP/COEP/CORP, nessun service worker né CDN</text>
  <text x="56" y="624" class="li">• Backup cifrato .mnbackup ed export Markdown</text>
  <rect x="56" y="642" width="370" height="46" rx="5" fill="#1C1A12" stroke="#EBB448" stroke-opacity="0.5"/>
  <text x="68" y="662" class="lbl" fill="#EBB448">Passphrase → Argon2id → MasterKey: mai inviata.</text>
  <text x="68" y="679" class="lblm">Login Supabase separato (codice email), mai la passphrase.</text>

  <!-- ============ Servizi ============ -->
  <text x="650" y="124" class="zone" fill="#00A3FF">SERVIZI · ZERO-KNOWLEDGE</text>

  <!-- Cloudflare Pages -->
  <rect x="650" y="140" width="520" height="96" rx="8" class="card"/>
  <rect x="650" y="140" width="5" height="96" fill="#8F9CAE"/>
  <text x="668" y="166" class="h2">Cloudflare Pages · modus.serv.run</text>
  <text x="668" y="188" class="li">Solo file statici: il bundle dell'app, <tspan class="mono">_headers</tspan> con CSP e isolamento,</text>
  <text x="668" y="206" class="li"><tspan class="mono">privacy.html</tspan>. Nessuna funzione che riscrive l'HTML (SRI resta valida).</text>
  <text x="668" y="224" class="lblm">Pubblicato da deploy-web.yml con wrangler; SHA-256 del bundle nel riepilogo del job.</text>

  <!-- Supabase -->
  <rect x="650" y="252" width="520" height="312" rx="8" class="card"/>
  <rect x="650" y="252" width="5" height="312" fill="#00A3FF"/>
  <text x="668" y="278" class="h2">Supabase · PostgreSQL + Auth <tspan class="lblm">(eu-central-1)</tspan></text>

  <rect x="668" y="290" width="486" height="48" rx="5" class="inner"/>
  <text x="680" y="310" class="h3">Auth (GoTrue) <tspan class="mono">/otp</tspan> <tspan class="mono">/verify</tspan></text>
  <text x="680" y="328" class="li">Codice o magic link per email → sessione JWT. Vede solo l'email.</text>

  <rect x="668" y="346" width="486" height="118" rx="5" class="inner"/>
  <text x="680" y="366" class="h3">PostgREST <tspan class="mono">/rest/v1</tspan> + PostgreSQL · RLS su ogni tabella</text>
  <text x="680" y="386" class="li">Append-only: <tspan class="mono">sync_rows</tspan> · <tspan class="mono">membership_records</tspan> · <tspan class="mono">key_bundles</tspan></text>
  <text x="680" y="404" class="li">Accessi: <tspan class="mono">workspaces</tspan> · <tspan class="mono">workspace_accounts</tspan></text>
  <text x="680" y="422" class="li">Collegamento dispositivi: <tspan class="mono">device_links</tspan> (15 minuti)</text>
  <text x="680" y="440" class="li">Trigger: compattazione delle revisioni superate, quote</text>
  <text x="680" y="456" class="lblm">Vede id opachi, posizioni, epoche, dimensioni, orari di sync. Mai titoli, tipi, tag, schemi.</text>

  <rect x="668" y="472" width="486" height="80" rx="5" class="inner"/>
  <text x="680" y="492" class="h3">Edge Functions (verify JWT) · nessuna chiave di servizio</text>
  <text x="680" y="512" class="li"><tspan class="mono">blob-url</tspan>: membro? (come il chiamante) → URL firmato 5 min</text>
  <text x="692" y="528" class="li">GET · PUT; DELETE e LIST eseguiti dalla funzione</text>
  <text x="680" y="546" class="li"><tspan class="mono">delete-account</tspan>: pulisce R2, poi <tspan class="mono">delete_account()</tspan></text>

  <!-- R2 -->
  <rect x="650" y="590" width="520" height="130" rx="8" class="card"/>
  <rect x="650" y="590" width="5" height="130" fill="#8B3FD6"/>
  <text x="668" y="616" class="h2">Cloudflare R2 · bucket <tspan class="mono" style="font-size:13px">modusnote-blobs</tspan></text>
  <text x="668" y="638" class="li">Oggetti <tspan class="mono">&lt;workspace&gt;/&lt;blob&gt;.enc</tspan>: audio e immagini cifrati,</text>
  <text x="668" y="656" class="li">chunk da 64 KiB, ognuno una busta XChaCha20-Poly1305 autenticata.</text>
  <text x="668" y="674" class="li">PUT solo con <tspan class="mono">If-None-Match: *</tspan> e <tspan class="mono">Content-Length</tspan> firmato.</text>
  <text x="668" y="692" class="li">Credenziali R2 solo nei segreti della funzione, mai nel client.</text>
  <text x="668" y="710" class="lblm">Vede solo id opachi e dimensioni. CORS limitato a modus.serv.run.</text>

  <!-- blob-url → R2 -->
  <line x1="1080" y1="552" x2="1080" y2="588" class="cipher" stroke-dasharray="4 3" marker-end="url(#ac)"/>
  <text x="1090" y="578" class="lblm">SigV4</text>

  <!-- ============ Flussi ============ -->
  <!-- browser → Pages -->
  <path d="M442,440 H636 V188 H648" class="ctrl" marker-end="url(#ag)"/>
  <text x="472" y="160" class="lbl">HTTPS · solo browser</text>
  <text x="472" y="174" class="lblm">bundle statico con SRI</text>

  <!-- dispositivi → Auth -->
  <line x1="462" y1="314" x2="666" y2="314" class="ctrl" marker-end="url(#ag)"/>
  <text x="472" y="296" class="lbl">email + codice</text>
  <text x="472" y="308" class="lblm">→ JWT (sigillato nel vault)</text>

  <!-- dispositivi ↔ PostgREST -->
  <line x1="462" y1="400" x2="666" y2="400" class="cipher" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <text x="472" y="370" class="lbl">righe cifrate e firmate</text>
  <text x="472" y="384" class="lblm">JWT Bearer + apikey publishable</text>
  <text x="472" y="420" class="lblm">push · pull dal cursore · link</text>

  <!-- dispositivi → blob-url -->
  <line x1="462" y1="510" x2="666" y2="510" class="ctrl" marker-end="url(#ag)"/>
  <text x="472" y="492" class="lbl">chiede l'URL del blob</text>
  <text x="472" y="504" class="lblm">workspace, blob, metodo, size</text>

  <!-- dispositivi ↔ R2 -->
  <line x1="462" y1="655" x2="648" y2="655" class="cipher" marker-start="url(#ac)" marker-end="url(#ac)"/>
  <text x="472" y="628" class="lbl">GET / PUT diretti</text>
  <text x="472" y="642" class="lblm">URL pre-firmato, solo ciphertext</text>
  <text x="472" y="674" class="lblm">il token Supabase non va mai a R2</text>

  <!-- ============ Build e distribuzione ============ -->
  <text x="38" y="760" class="zone" fill="#8F9CAE">BUILD E DISTRIBUZIONE</text>
  <rect x="20" y="772" width="780" height="128" rx="8" class="card"/>
  <rect x="20" y="772" width="5" height="128" fill="#8F9CAE"/>
  <text x="38" y="798" class="h2">GitHub Actions</text>
  <text x="38" y="822" class="h3">ci.yml</text>
  <text x="38" y="840" class="li">analyze, architecture guard, test dei pacchetti e dell'app,</text>
  <text x="38" y="856" class="li">RLS su PostgreSQL, e2e PostgREST, e2e web in Chrome (WASM e JS)</text>
  <text x="38" y="872" class="li">AAB di prova (pagine da 16 KB)</text>
  <text x="470" y="822" class="h3">deploy-web.yml <tspan class="lblm">dopo CI verde su main</tspan></text>
  <text x="470" y="840" class="li">build web --wasm --csp, SRI sha384,</text>
  <text x="470" y="856" class="li">SHA256SUMS, wrangler pages deploy</text>
  <text x="470" y="878" class="h3">release-android.yml <tspan class="lblm">tag android-v*</tspan></text>
  <text x="470" y="894" class="li">App Bundle firmato con la upload key</text>

  <rect x="830" y="772" width="340" height="128" rx="8" class="card"/>
  <rect x="830" y="772" width="5" height="128" fill="#8F9CAE"/>
  <text x="848" y="798" class="h2">Google Play</text>
  <text x="848" y="822" class="li">Play App Signing rifirma il bundle</text>
  <text x="848" y="840" class="li">con la chiave dell'app e lo distribuisce</text>
  <text x="848" y="858" class="li">ai telefoni Android.</text>
  <text x="848" y="882" class="lblm">Privacy: modus.serv.run/privacy.html</text>

  <line x1="800" y1="886" x2="828" y2="886" class="ctrl" marker-end="url(#ag)"/>
  <path d="M700,772 V740 H1186 V188 H1172" class="ctrl" marker-end="url(#ag)"/>
  <text x="1012" y="734" class="lblm">pubblica il bundle web</text>

  <!-- ============ Legenda ============ -->
  <line x1="30" y1="930" x2="70" y2="930" class="cipher" marker-end="url(#ac)"/>
  <text x="80" y="934" class="lbl">ciphertext (buste del dominio)</text>
  <line x1="300" y1="930" x2="340" y2="930" class="ctrl" marker-end="url(#ag)"/>
  <text x="350" y="934" class="lbl">controllo: bundle, login, URL firmati, deploy</text>
  <rect x="660" y="922" width="16" height="16" rx="3" fill="none" stroke="#EBB448" stroke-dasharray="4 3"/>
  <text x="686" y="934" class="lbl">zona fidata: unica con chiavi e testo in chiaro</text>
  <text x="30" y="960" class="lblm">Tutte le connessioni sono HTTPS. La sincronizzazione tra telefono e browser passa solo dal server: ogni dispositivo è un membro del vault con la propria identità (Ed25519 + X-Wing).</text>
</svg>
